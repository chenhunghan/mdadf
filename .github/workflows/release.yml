name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.artifact }}
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: mdadf-darwin-arm64
            archive: tar.gz
          - target: bun-darwin-x64
            artifact: mdadf-darwin-x64
            archive: tar.gz
          - target: bun-linux-arm64
            artifact: mdadf-linux-arm64
            archive: tar.gz
          - target: bun-linux-x64
            artifact: mdadf-linux-x64
            archive: tar.gz
          - target: bun-windows-x64
            artifact: mdadf-windows-x64
            archive: zip
          - target: bun-windows-arm64
            artifact: mdadf-windows-arm64
            archive: zip
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build src/index.ts --compile --minify --target=${{ matrix.target }} --outfile mdadf

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf ${{ matrix.artifact }}.tar.gz mdadf

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: zip ${{ matrix.artifact }}.zip mdadf.exe

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ matrix.artifact }}.tar.gz
          else
            gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ matrix.artifact }}.zip
          fi

  checksums:
    name: Generate checksums
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download ${{ needs.release-please.outputs.tag_name }} --dir assets/

      - name: Generate SHA256 checksums
        working-directory: assets
        run: sha256sum * > checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} assets/checksums.txt
