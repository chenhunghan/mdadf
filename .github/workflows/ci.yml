name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Format, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bunx oxfmt --check src/

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build (verify compilation)
        run: bun run build

      - name: Smoke test binary
        run: |
          echo '# Test' | ./mdadf --compact | jq .type
          echo '**bold**' | ./mdadf -o /tmp/out.json
          jq .type /tmp/out.json
